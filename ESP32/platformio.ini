[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
; Prevent framework verbose header/body diagnostics from exposing credentials.
build_flags = -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps = bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:scripts/bound_webserver.py

[env:storage_diagnostics]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSTORAGE_DIAGNOSTICS

; Explicit physical-flight build. Ordinary mission/manual altitude limits remain 40cm.
[env:flight_test]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DGATEWAY_GROUND_TEST_MODE=0 -DGATEWAY_FLIGHT_TEST_PROFILE=1

; Explicit mission execution. Local coordinates, 1m target, 0.8–1.2m operating range.
[env:mission_flight]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DGATEWAY_GROUND_TEST_MODE=0 -DGATEWAY_MISSION_FLIGHT_PROFILE=1

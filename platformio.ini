[platformio]
default_envs = nodemcuv2

; PROVISIONAL compile target: confirm NodeMCU v2 / ESP-12E, 4MB flash before upload.
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
extra_scripts = pre:scripts/bound_webserver.py
lib_ignore = ESP8266WebServer
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.15
build_flags = -Wall -Wextra

[env:nodemcuv2_physical]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -DDEMO_MODE=false

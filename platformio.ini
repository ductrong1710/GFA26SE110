[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
; Prevent framework verbose header/body diagnostics from exposing credentials.
build_flags = -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
lib_deps = bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:scripts/bound_webserver.py

[env:storage_diagnostics]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSTORAGE_DIAGNOSTICS

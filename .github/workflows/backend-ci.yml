name: Backend CI

on:
  push:
    branches: [BackEnd]
  pull_request:
    branches: [BackEnd]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10 / PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_test
          # Disposable runner-only credentials; never used by the application.
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=ci_test;Password=ci_test_only;Include Error Detail=false
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FarmMonitoring.slnx

      - name: Build
        run: dotnet build FarmMonitoring.slnx --configuration Release --no-restore

      - name: Run unit and PostgreSQL integration tests
        run: >-
          dotnet test FarmMonitoring.slnx
          --configuration Release --no-build --no-restore
          --logger trx
          --results-directory TestResults

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.run_attempt }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
